<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Orrery - an interactive 3D Solar System. Fly between planets, bend time, and see the true scale of space." />
    <meta name="theme-color" content="#04060d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e8b04a'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%237fd4ff' stroke-width='1.6' transform='rotate(-18 16 16)'/%3E%3C/svg%3E" />
    <title>Orrery - Interactive 3D Solar System</title>
    <style>
      /* Critical boot styles, inlined so the loading screen renders correctly
         before the bundled stylesheet arrives. */
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #04060d;
        color: #dde6f4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #04060d;
      }
      .boot-mark {
        font-size: 22px;
        font-weight: 200;
        letter-spacing: 0.55em;
        padding-left: 0.55em;
      }
      .boot-bar {
        width: min(260px, 60vw);
        height: 2px;
        background: rgba(158, 189, 255, 0.12);
        border-radius: 1px;
        overflow: hidden;
      }
      .boot-bar-fill {
        height: 100%;
        width: 0%;
        background: #7fd4ff;
        transition: width 0.25s ease;
      }
      .boot-msg {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #76869f;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" role="status" aria-live="polite">
        <div class="boot-mark">ORRERY</div>
        <div class="boot-bar"><div class="boot-bar-fill" id="boot-fill"></div></div>
        <div class="boot-msg" id="boot-msg">Generating the solar system…</div>
      </div>
    </div>
    <noscript>
      <div style="position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: #04060d; color: #8494b0; font-family: sans-serif; text-align: center; padding: 24px">
        Orrery needs JavaScript to render the Solar System. Please enable it and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
