# Build the app and publish it to GitHub Pages.
#
# The built dist/ is force-pushed to the gh-pages branch and the Pages site
# is configured (idempotently) to serve that branch, so every push to the
# branches below goes live at:
#   https://meetmaniya1221-cmd.github.io/Demo-3d-website/
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/astronomy-sim-audit-polish-wl7yuw
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Ensure the Pages site serves gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() {
            curl -sS -o /tmp/pages-resp.json -w "%{http_code}" \
              -X "$1" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              ${2:+-d "$2"}
          }
          code=$(api GET)
          if [ "$code" = "404" ]; then
            echo "Pages site not configured yet - creating it against gh-pages"
            code=$(api POST '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
            echo "create -> $code"; cat /tmp/pages-resp.json; echo
          else
            echo "Pages site exists - making sure it serves gh-pages"
            code=$(api PUT '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
            echo "update -> $code"; cat /tmp/pages-resp.json; echo
          fi
          case "$code" in
            2*) echo "Pages configured." ;;
            *) echo "Pages API returned $code - if this is a permissions error, enable Pages once in the repo settings (source: gh-pages branch)."; exit 1 ;;
          esac
