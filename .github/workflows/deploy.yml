name: Deploy to GitHub Pages

# NOTE: the `github-pages` environment has a deployment branch policy that
# only admits `claude/3d-solar-system-edu-rxmhpb`. A push to any other branch
# builds fine and is then rejected by the deploy job in about two seconds,
# with no logs to explain why - so the other branches were only ever
# generating red runs. Land work on the branch below to publish it, or widen
# the environment's policy in Settings -> Environments -> github-pages.
on:
  push:
    branches:
      - claude/3d-solar-system-edu-rxmhpb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Best effort: switch the Pages source to workflow deployments so the
      # automatic "deploy from branch" build stops racing this workflow.
      - name: Set Pages build type to workflow
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' \
            -o /dev/null -w "pages config update: HTTP %{http_code}\n" || true

      # Fallback guard: if a legacy branch build is still running for this
      # push, let it finish first so our deployment is the one that sticks.
      - name: Wait out any in-flight legacy Pages build
        run: |
          for i in $(seq 1 40); do
            count=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=20" \
              | jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "${count:-0}" = "0" ]; then
              echo "no legacy pages build in flight"
              break
            fi
            echo "legacy pages build still running ($count), waiting…"
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4
